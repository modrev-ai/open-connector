# MRO-806: run open-connector from the fork's own image (Jong: "yes, build from the fork").
# Only the image changes; ports, volume and environment come from docker-compose.yml and
# docker-compose.override.yml. Committed here (MRO-1039) because the running project named this
# file from a %TEMP% scratchpad (oc-image-fork.yml there, byte-for-byte the same image line),
# where files have been deleted by a clean-up whose cause is unknown (MRO-920 c16271/c16272).
# Start the stack with all three files:
#   docker compose -f docker-compose.yml -f docker-compose.override.yml \
#     -f docker-compose.fork.yml --env-file <the hub's open-connector.env> up -d
# The --env-file is NOT optional (TH-791, 2026-11-11): the stored connections are encrypted with its
# OOMOL_CONNECT_ENCRYPTION_KEY. After the 2026-11-10 reboot the stack came up from the first two files
# without it, so every connection read failed with "enc:v1... is not valid JSON" until it was restarted
# with the env file. The hub's file is C:\Workstation\mcp-gateway\hub\.run\open-connector.env.
# Build a new tag with: docker build -f docker/Dockerfile -t modrev/open-connector:fork-<sha> .
services:
  connector:
    image: modrev/open-connector:fork-0dbda49d
