name: CI

# PR quality gates for OOMOL Connect, run serially in a single job:
#   1) Lint (oxlint + oxfmt)  ->  2) Typecheck (build)  ->  3) Unit tests (vitest)
# Serial keeps it simple and fail-fast: dependencies install once and a failing
# earlier step short-circuits the rest. Also runs on pushes to main so the default
# branch stays green and the npm cache stays warm for PR runs.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Scoped to pull requests, not removed (MRO-376).
  #
  # On a PR branch a superseded run really does describe a commit nobody is on,
  # and cancelling it saves minutes. On a push to a protected branch the opposite
  # holds: a commit superseded within minutes is usually one somebody is fixing,
  # which is exactly when its verdict matters most.
  #
  # Measured elsewhere in this fleet: financial-cortex 809a41e shipped with a
  # seeded test mutation still in it, and its CI came back `cancelled` rather
  # than red because the fix pushed two minutes later. Not red, not green, no
  # verdict at all - on the one commit that most needed one.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only reads the repository.
permissions:
  contents: read

env:
  # This project runs TypeScript directly with `node` (native type stripping) and
  # forbids `tsx` / `--experimental-strip-types` (see AGENTS.md). Type stripping is
  # on by default only on Node >= 22.18 / >= 23.6, so pin an LTS that supports it.
  # Do NOT downgrade below 22.18 — `npm ci` (postinstall codegen) and typecheck fail.
  NODE_VERSION: "24"

jobs:
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: open_connector_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/open_connector_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # No step needs the persisted GITHUB_TOKEN in git config; dropping it
          # keeps `npm ci` postinstall scripts from reading it (zizmor hardening).
          persist-credentials: false

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Runs postinstall codegen (provider registry + catalog).
      - name: Install dependencies
        run: npm ci

      # 1) Lint
      - name: Lint (oxlint)
        run: npm run lint

      - name: Check formatting (oxfmt)
        run: npm run format

      # 2) Typecheck (build): regenerates the registry, type-checks src/scripts/examples.
      - name: Typecheck
        run: npm run typecheck

      # 3) Unit tests (vitest): covers src and the web workspace.
      - name: Run tests (vitest)
        run: npm test
